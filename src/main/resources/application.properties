spring.application.name=dl-ms-enrolment

# Fix: allow Jackson to serialize Java 8 date/time types (LocalDateTime)
spring.jackson.serialization.write-dates-as-timestamps=false


server.port=${SERVER_PORT:8080}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:enrollmentdb}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:madride123}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect



spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000

# ============================================
# KEYCLOAK OAUTH2 RESOURCE SERVER CONFIGURATION
# ============================================
# These properties configure Spring Security to validate JWT tokens
# issued by Keycloak. Replace with your actual Keycloak server URL and realm.

# Keycloak server URL and realm
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/master}

# Keycloak's public key set (JWKS) endpoint
# Used to validate JWT token signatures
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://localhost:8081/realms/master/protocol/openid-connect/certs}

# Optional: Audience claim validation
# Set to your application name if Keycloak enforces audience validation
spring.security.oauth2.resourceserver.jwt.audience=${KEYCLOAK_AUDIENCE:enrollment-app}

# Claims to use as Principal name (username)
# "sub" = subject (user ID), "preferred_username" = username
spring.security.oauth2.resourceserver.jwt.principal-claim-name=preferred_username

# ============================================
# KEYCLOAK CLIENT CONFIGURATION (for /auth/login endpoint)
# ============================================
# These are the credentials for the backend to authenticate with Keycloak
# Used to exchange user credentials for JWT tokens

# Token endpoint URL where backend can request tokens
keycloak.token-url=${KEYCLOAK_TOKEN_URL:http://localhost:8081/realms/master/protocol/openid-connect/token}

# Client credentials for password grant flow
keycloak.client-id=${KEYCLOAK_CLIENT_ID:Enrollement-Frontend}
keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET:HTq1qCVWwR53AffsRx9Of0cHrw2P1Am0}

# Keycloak Admin REST API (used for password reset, user sync)
# The admin-url points to the admin API for the realm
keycloak.admin-url=${KEYCLOAK_ADMIN_URL:http://localhost:8081/admin/realms/master}
# Keycloak admin credentials (must have manage-users role in Keycloak)
keycloak.admin-username=${KEYCLOAK_ADMIN_USERNAME:admin}
keycloak.admin-password=${KEYCLOAK_ADMIN_PASSWORD:admin}

# ============================================
# LOGGING CONFIGURATION
# ============================================
logging.pattern.level=%5p [requestId=%X{requestId:-N/A}]
logging.level.org.bcp.dlmsenrolment=${APP_LOG_LEVEL:INFO}
logging.level.org.bcp.dlmsenrolment.security=${APP_SECURITY_LOG_LEVEL:INFO}
logging.level.org.springframework.security=${SPRING_SECURITY_LOG_LEVEL:WARN}
logging.level.org.springframework.security.web.authentication=${SPRING_AUTH_LOG_LEVEL:WARN}
