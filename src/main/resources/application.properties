account-validation.client-id=${ACCOUNT_VALIDATION_CLIENT_ID:partnerclient}
account-validation.client-secret=${ACCOUNT_VALIDATION_CLIENT_SECRET:yDxr6SyenN6dOzryukoAwQvAFO1X1tMD}
