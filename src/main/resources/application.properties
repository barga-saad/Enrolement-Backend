spring.application.name=dl-ms-enrolment


server.port=${SERVER_PORT:8080}

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect



spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000

# ============================================
# KEYCLOAK OAUTH2 RESOURCE SERVER CONFIGURATION
# ============================================
# These properties configure Spring Security to validate JWT tokens
# issued by Keycloak. Replace with your actual Keycloak server URL and realm.

# Keycloak server URL and realm
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://keycloak:8080/realms/enrollment-realm}

# Keycloak's public key set (JWKS) endpoint
# Used to validate JWT token signatures
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://keycloak:8080/realms/enrollment-realm/protocol/openid-connect/certs}

# Optional: Audience claim validation
# Set to your application name if Keycloak enforces audience validation
spring.security.oauth2.resourceserver.jwt.audience=${KEYCLOAK_AUDIENCE:enrollment-app}

# Claims to use as Principal name (username)
# "sub" = subject (user ID), "preferred_username" = username
spring.security.oauth2.resourceserver.jwt.principal-claim-name=preferred_username

# ============================================
# LOGGING CONFIGURATION
# ============================================
logging.level.org.bcp.dlmsenrolment.security=DEBUG
logging.level.org.bcp.dlmsenrolment.services=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.springframework.security.web.authentication=DEBUG
