# ============================================
# KEYCLOAK OAUTH2 RESOURCE SERVER CONFIGURATION
# ============================================
# These properties configure Spring Security to validate JWT tokens
# issued by Keycloak. Replace with your actual Keycloak server URL and realm.

# Keycloak server URL and realm
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:https://10.2.60.146:9443/auth/realms/BCP-INTERNAL}

# Keycloak's public key set (JWKS) endpoint
# Used to validate JWT token signatures
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:https://10.2.60.146:9443/auth/realms/BCP-INTERNAL/protocol/openid-connect/certs}

# Claims to use as Principal name (username)
# "sub" = subject (user ID), "preferred_username" = username
spring.security.oauth2.resourceserver.jwt.principal-claim-name=preferred_username

# ============================================
# KEYCLOAK CLIENT CONFIGURATION (for /auth/login endpoint)
# ============================================
# These are the credentials for the backend to authenticate with Keycloak
# Used to exchange user credentials for JWT tokens

# Token endpoint URL where backend can request tokens
keycloak.token-url=${KEYCLOAK_TOKEN_URL:https://10.2.60.146:9443/auth/realms/BCP-INTERNAL/protocol/openid-connect/token}

# Client credentials for password grant flow
keycloak.client-id=${KEYCLOAK_CLIENT_ID:Enrollement-Frontend}
keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET:l8zmFGyic1PzbfH5VwMTAtGbUG1R0nrB}

